<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamerarepussa - Valokuvaus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f9f9f9;
            color: #333;
        }

        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
        }

        header {
            background: #fff;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 20px 5%;
            max-width: 1400px;
            margin: auto;
        }

        .nav-links {
            display: flex;
            list-style: none;
        }

        .nav-links li {
            margin-left: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
        }

        .hero {
            height: 100vh;
            margin-top: 70px;
            background: url('Kateriina.jpg') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #ff5a5f;
            color: #fff;
            border-radius: 30px;
            text-decoration: none;
            margin: 10px;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .portfolio-item {
            height: 300px;
            overflow: hidden;
            border-radius: 8px;
            position: relative;
            cursor: zoom-in;
        }

        .portfolio-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .portfolio-item:hover img {
            transform: scale(1.05);
        }

        .portfolio-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .portfolio-item:hover .portfolio-overlay {
            opacity: 1;
        }

        .portfolio-overlay h3 {
            color: #fff;
        }

        /* ===== LIGHTBOX ===== */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            cursor: pointer;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 6px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        footer {
            background: #222;
            color: #aaa;
            text-align: center;
            padding: 40px 20px;
        }
    </style>
</head>

<body>

<header>
    <nav class="navbar">
        <strong>Kamerarepussa</strong>
        <ul class="nav-links">
            <li><a href="#portfolio">Portfolio</a></li>
            <li><a href="#contact">Yhteys</a></li>
        </ul>
    </nav>
</header>

<section class="hero">
    <div>
        <h1>VALOKUVAUS</h1>
        <p>Hetkiä, tarinoita ja tunnelmaa</p>
        <a href="#portfolio" class="btn">Portfolio</a>
    </div>
</section>

<section id="portfolio">
    <div class="portfolio-grid">
        <div class="portfolio-item">
            <img src="emma2.jpg" alt="">
            <div class="portfolio-overlay"><h3>Muotokuvaus</h3></div>
        </div>
        <div class="portfolio-item">
            <img src="thestickycat.jpg" alt="">
            <div class="portfolio-overlay"><h3>Bändikuvaus</h3></div>
        </div>
        <div class="portfolio-item">
            <img src="ruokakuva.jpg" alt="">
            <div class="portfolio-overlay"><h3>Ruokakuvaus</h3></div>
        </div>
    </div>
</section>

<!-- LIGHTBOX -->
<div id="lightbox">
    <img id="lightbox-img">
</div>

<footer>
    &copy; <span id="year"></span> Kamerarepussa
</footer>

<script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const images = document.querySelectorAll('.portfolio-item img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    images.forEach(img => {
        img.addEventListener('click', () => {
            lightboxImg.src = img.src;
            lightbox.style.display = 'flex';
        });
    });

    lightbox.addEventListener('click', () => {
        lightbox.style.display = 'none';
    });
</script>

</body>
</html>
